# Copy to secret.yaml, fill in, and apply it yourself (it is not part of kustomization.yaml
# so real secrets never end up in git):
#   kubectl -n windesheim-readers apply -f secret.yaml
# Or create it straight from the command line:
#   kubectl -n windesheim-readers create secret generic windesheim-readers \
#     --from-literal=APP_SECRET="$(openssl rand -base64 32)" \
#     --from-literal=RESEND_API_KEY=re_...
apiVersion: v1
kind: Secret
metadata:
  name: windesheim-readers
type: Opaque
stringData:
  # Required. Signs sessions and encrypts the AI API keys stored in the database.
  # Never change it after first start, or stored AI keys can no longer be decrypted.
  APP_SECRET: "generate-with-openssl-rand-base64-32"
  # Optional. Without it, magic links are only printed in the pod log.
  RESEND_API_KEY: ""
