<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f1ecff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1536" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Readers" />
    <!-- Link previews. The server (server/og) replaces this block per path, with absolute URLs from APP_URL. -->
    <!-- og:start -->
    <title>Windesheim Readers</title>
    <meta name="description" content="Leer je Windesheim-reader met korte lessen, flashcards, quizzen, luisterlessen en live Quiz Battles tegen je klasgenoten." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Windesheim Readers" />
    <meta property="og:locale" content="nl_NL" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta property="og:title" content="Windesheim Readers" />
    <meta property="og:description" content="Leer je Windesheim-reader met korte lessen, flashcards, quizzen, luisterlessen en live Quiz Battles tegen je klasgenoten." />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/og/default.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Windesheim Readers: leer je reader, speel je les" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Windesheim Readers" />
    <meta name="twitter:description" content="Leer je Windesheim-reader met korte lessen, flashcards, quizzen, luisterlessen en live Quiz Battles tegen je klasgenoten." />
    <meta name="twitter:image" content="/og/default.png" />
    <meta name="twitter:image:alt" content="Windesheim Readers: leer je reader, speel je les" />
    <!-- og:end -->
    <script>
      // Apply the saved theme before first paint (next-themes takes over once React mounts).
      try {
        var t = localStorage.getItem("theme");
        var dark = t === "dark" || ((!t || t === "system") && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
